# Builds the installers on Windows, macOS and Linux and publishes them as a GitHub release.
# Runs when a version tag is pushed:  git tag v2.0.0 && git push origin v2.0.0
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.label }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            label: Windows
          - os: macos-latest
            label: macOS
          - os: ubuntu-latest
            label: Linux
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Version
        run: echo "VERSION=$(grep -m1 '^version' build.gradle.kts | cut -d'"' -f2)" >> "$GITHUB_ENV"

      - name: Test
        run: ./gradlew --no-daemon build

      - name: Install WiX 3 (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }
          $wix = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" | Select-Object -First 1
          if ($wix) { "$($wix.FullName)\bin" | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8 }

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: |
          mkdir -p dist
          ./gradlew --no-daemon jpackage -PinstallerType=msi
          cp build/jpackage/out/*.msi "dist/FarmersBW-$VERSION-windows-x64.msi"
          ./gradlew --no-daemon jpackage
          (cd build/jpackage/out && 7z a -tzip "../../../dist/FarmersBW-$VERSION-windows-x64-portable.zip" FarmersBW > /dev/null)

      - name: Package (macOS)
        if: runner.os == 'macOS'
        run: |
          mkdir -p dist
          ./gradlew --no-daemon jpackage -PinstallerType=dmg
          cp build/jpackage/out/*.dmg "dist/FarmersBW-$VERSION-macos-$(uname -m).dmg"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p dist
          ./gradlew --no-daemon jpackage -PinstallerType=deb
          cp build/jpackage/out/*.deb "dist/FarmersBW-$VERSION-linux-amd64.deb"
          cp build/libs/*-all.jar "dist/FarmersBW-$VERSION-all.jar"

      - uses: actions/upload-artifact@v4
        with:
          name: farmersbw-${{ matrix.label }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Publish release
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "FarmersBW ${GITHUB_REF_NAME#v}" \
            --notes-file packaging/release-notes.md
