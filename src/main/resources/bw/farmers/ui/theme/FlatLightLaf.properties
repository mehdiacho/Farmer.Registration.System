# FarmersBW theme on top of FlatLaf Light.
# Palette: sand background, forest green for actions, sorghum gold and clay for status.
# The same tokens are mirrored as constants in bw.farmers.ui.Ui.

@background = #F5F0E6
@foreground = #1D2B22
@accentColor = #1E5B3A
@selectionBackground = #1E5B3A
@selectionForeground = #FFFFFF
@disabledForeground = #8E978F

defaultFont = 14 Inter

#---- components ----
Component.arc = 10
Component.focusWidth = 2
Component.innerFocusWidth = 0
Component.borderColor = #DCD2C0
Component.disabledBorderColor = #E8E1D3
Component.focusedBorderColor = #1E5B3A
Component.focusColor = #1E5B3A44

TextComponent.arc = 10
TextField.background = #FFFFFF
TextField.margin = 9,12,9,12
PasswordField.background = #FFFFFF
PasswordField.margin = 9,12,9,12
PasswordField.showRevealButton = true
TextField.placeholderForeground = #9AA197
FormattedTextField.background = #FFFFFF
TextField.inactiveBackground = #FBF8F2
TextField.disabledBackground = #FBF8F2

ComboBox.background = #FFFFFF
ComboBox.nonEditableBackground = #FFFFFF
ComboBox.buttonBackground = #FFFFFF
ComboBox.buttonEditableBackground = #FFFFFF
ComboBox.buttonArrowColor = #5E6A60
ComboBox.padding = 7,10,7,10
ComboBox.selectionBackground = #E2EEE5
ComboBox.selectionForeground = #1D2B22
ComboBox.disabledBackground = #FBF8F2
Spinner.background = #FFFFFF
Spinner.buttonBackground = #FFFFFF
Spinner.padding = 7,10,7,10
Spinner.disabledBackground = #FBF8F2

List.selectionBackground = #E2EEE5
List.selectionForeground = #1D2B22
List.selectionInactiveBackground = #E2EEE5
List.selectionInactiveForeground = #1D2B22
PopupMenu.borderCornerRadius = 10
Popup.borderCornerRadius = 10

Button.arc = 10
Button.margin = 8,16,8,16
Button.background = #FFFFFF
Button.borderColor = #DCD2C0
Button.hoverBackground = #FBF8F2
Button.pressedBackground = #F1EADD
Button.focusedBorderColor = #1E5B3A
Button.default.background = #1E5B3A
Button.default.foreground = #FFFFFF
Button.default.borderColor = #1E5B3A
Button.default.hoverBackground = #174A2F
Button.default.pressedBackground = #123C26
Button.default.focusedBorderColor = #FFFFFF
Button.default.focusColor = #1E5B3A66

CheckBox.icon.selectedBackground = #1E5B3A
CheckBox.icon.selectedBorderColor = #1E5B3A
CheckBox.icon.checkmarkColor = #FFFFFF
CheckBox.icon.focusedBorderColor = #1E5B3A
CheckBox.arc = 5

#---- tables ----
Table.background = #FFFFFF
Table.rowHeight = 52
Table.selectionBackground = #E2EEE5
Table.selectionForeground = #1D2B22
Table.selectionInactiveBackground = #EDF3EE
Table.selectionInactiveForeground = #1D2B22
Table.gridColor = #EFE8DC
Table.showHorizontalLines = true
Table.showVerticalLines = false
Table.intercellSpacing = 0,1
Table.cellFocusColor = #00000000
TableHeader.background = #FBF8F2
TableHeader.foreground = #5E6A60
TableHeader.height = 42
TableHeader.cellMargins = 2,16,2,16
TableHeader.separatorColor = #FBF8F2
TableHeader.bottomSeparatorColor = #E4DACA

#---- scrolling ----
ScrollPane.background = #FFFFFF
ScrollBar.width = 12
ScrollBar.thumbArc = 999
ScrollBar.thumbInsets = 3,3,3,3
ScrollBar.track = #00000000
ScrollBar.thumb = #D6CCBA
ScrollBar.hoverThumbColor = #C2B7A3
ScrollBar.showButtons = false
Viewport.background = #F5F0E6

#---- misc ----
Separator.foreground = #E4DACA
ToolTip.background = #1D2B22
ToolTip.foreground = #F5F0E6
ToolTip.border = 6,10,6,10
TitlePane.unifiedBackground = true
TitlePane.background = #F5F0E6
TitlePane.inactiveBackground = #F5F0E6
TitlePane.foreground = #1D2B22
TitlePane.embeddedForeground = #1D2B22
OptionPane.background = #FFFFFF
FileChooser.background = #FFFFFF
